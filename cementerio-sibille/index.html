<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sibille y el Cementerio Limpio</title>
<link rel="stylesheet" href="style.css">
<script>if (new URLSearchParams(location.search).get("embedded") === "1") document.documentElement.classList.add("embedded");</script>
</head>
<body>

  <div id="game-container">
    <!-- La interfaz y el canvas comparten las mismas dimensiones visuales. -->
    <div id="game-stage">

    <div id="hud">
      <div id="hud-trash" class="hud-box">
        <span class="hud-label">Basura restante</span>
        <span id="hud-trash-value" class="hud-value">0</span>
      </div>
      <div id="hud-score" class="hud-box">
        <span class="hud-label">Puntuación</span>
        <span id="hud-score-value" class="hud-value">0</span>
      </div>
    </div>

    <audio id="graveyard-music" src="https://res.cloudinary.com/dslosjjeb/video/upload/v1793809032/Graveyard_Cleanup_d2tihc.mp3" preload="none" loop></audio>
    <button id="music-toggle" type="button" aria-pressed="true" title="Silenciar música">♫ Música: ON</button>

    <button id="skip-button" title="Saltar el minijuego y continuar la historia">Saltar juego ⏭</button>

    <canvas id="game-canvas" width="1672" height="941"></canvas>
    <p id="game-hint" class="hidden" role="status"></p>

    <div id="loading-screen">
      <div id="loading-box">
        <h1>Sibille</h1>
        <p>y el Cementerio Limpio</p>
        <div id="loading-bar-track">
          <div id="loading-bar-fill"></div>
        </div>
        <span id="loading-text">Cargando recursos... 0%</span>
      </div>
    </div>

    <div id="end-screen" class="hidden">
      <div id="end-box">
        <h2>Cementerio limpio</h2>
        <p>¡Muy bien! Ya has limpiado la mitad del cementerio. Aún queda la otra mitad. ¡Sigue reciclando para dejarlo completamente limpio!</p>
        <p id="end-score"></p>
        <div id="end-actions">
          <button id="home-button">↺ Volver al inicio</button>
          <button id="restart-button">Jugar otra vez</button>
          <button id="continue-button">Continuar ➔</button>
        </div>
      </div>
    </div>

    </div><!-- /game-stage -->

    <button id="fullscreen-button" type="button" aria-label="Activar pantalla completa" title="Pantalla completa">⛶ Pantalla completa</button>

    <!-- Controles táctiles independientes de la lógica y gráficos del juego. -->
    <nav id="mobile-controls" aria-label="Controles de movimiento de Sibille">
      <div class="direction-pad" aria-label="Cruceta de movimiento">
        <button class="move-btn move-up" type="button" data-key="arrowup" aria-label="Mover arriba">▲</button>
        <button class="move-btn move-left" type="button" data-key="arrowleft" aria-label="Mover izquierda">◀</button>
        <button class="move-btn move-down" type="button" data-key="arrowdown" aria-label="Mover abajo">▼</button>
        <button class="move-btn move-right" type="button" data-key="arrowright" aria-label="Mover derecha">▶</button>
      </div>
      <span class="mobile-controls-hint">Mantén pulsadas las flechas para caminar</span>
    </nav>
  </div>

<script src="game.js"></script>
<script src="music.js"></script>
<script src="touch-controls.js"></script>
<script src="mobile-layout.js"></script>
</body>
</html>
